apiVersion: v1
kind: Service
metadata:
  name: mul-service
  labels:
    {{- include "calc.commonLabels" . | nindent 4 }}
    app: mul-service
spec:
  type: {{ .Values.mul.service.type }}
  ports:
    - port: {{ .Values.mul.service.port }}
      targetPort: {{ .Values.mul.containerPort }}
      protocol: TCP
      name: http
  selector:
    app: mul-service
