apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher-endpointslice-reader
  namespace: chat-app
# Least privilege: the dispatcher only needs to watch EndpointSlices (to keep
# its consistent-hash ring in sync with the live RTN pods).
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
