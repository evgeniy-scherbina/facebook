apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chat-app

resources:
  - namespace.yaml
  - configmap.yaml
  - redis/
  - message/
  - real-time-ntfn/
  - ingress.yaml         #  requires installed ingress controller
  - events-ingress.yaml  #  /events with consistent-hash (upstream-hash-by:$arg_room)
  # NOTE: sum/mul/sub/calc are now deployed via the Helm chart at helm/calc/
  # (the ingress.yaml above still routes /sum,/mul,/sub,/calc to those Helm-managed services)
