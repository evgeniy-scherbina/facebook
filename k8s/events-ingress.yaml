apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: events-ingress
  namespace: chat-app
  annotations:
    # Consistent-hash /events?room=X to a backend RTN pod by the room value, so
    # all viewers of a room land on the SAME replica. That replica is then the
    # only one subscribed to comments:{room} (co-location). This annotation is
    # per-Ingress, which is why /events lives in its own Ingress (not chat-ingress).
    nginx.ingress.kubernetes.io/upstream-hash-by: "$arg_room"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /events
        pathType: Prefix
        backend:
          service:
            name: real-time-ntfn-service
            port:
              number: 80
