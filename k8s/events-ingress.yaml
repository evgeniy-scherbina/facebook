apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: events-ingress
  namespace: chat-app
  # No upstream-hash-by here: the dispatcher does the room->pod consistent
  # hashing itself. nginx just round-robins /events across dispatcher pods
  # (every dispatcher computes the same ring, so routing stays consistent).
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /events
        pathType: Prefix
        backend:
          service:
            name: dispatcher
            port:
              number: 80
