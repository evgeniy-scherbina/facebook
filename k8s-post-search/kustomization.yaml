apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: post-search

resources:
  - namespace.yaml
  - redis/         # holds the search index (and, for now, the posts themselves)
  - post/
  - search/
  - ingress.yaml  # reuses the existing ingress-nginx ELB (paths /posts, /search)
