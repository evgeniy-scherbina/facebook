apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: post-search-ingress
  namespace: post-search
  # ingressClassName: nginx => served by the existing ingress-nginx controller,
  # so this reuses the SAME AWS ELB as the chat app. No new load balancer.
  #
  # All post-search routes live under the /fb-post-search/ prefix (project
  # namespacing on the shared host). The rewrite strips the prefix before
  # forwarding, so the services keep their plain /posts and /search routes:
  #   GET  /fb-post-search/search?q=hi  ->  search-service  GET  /search?q=hi
  #   POST /fb-post-search/posts        ->  post-service    POST /posts
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /fb-post-search(/posts.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: post-service
            port:
              number: 80
      - path: /fb-post-search(/search.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: search-service
            port:
              number: 80
