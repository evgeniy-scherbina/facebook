apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: post-search
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          # Persistence enabled (unlike the chat app's pub/sub Redis): this one
          # holds the search index AND the posts, so a restart would otherwise
          # lose everything. Still not durable enough for production — see the
          # article's note about MemoryDB / rebuilding the index from a source
          # of truth.
          args: ["--appendonly", "yes"]
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
